name: VoiceflowDesktop
options:
  bundleIdPrefix: com.voiceflow
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  # Sparkle (auto-update) is a Phase 2 feature — requires Developer ID + notarization.
  # Re-enable once the appcast server is live and the app is properly signed.

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.voiceflow.desktop
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "25"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "GD42PF6FBY"  # Apple Developer Team ID (Thomas Murschetz)
    INFOPLIST_FILE: VoiceflowDesktop/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VoiceflowDesktop/Resources/VoiceflowDesktop.entitlements
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  VoiceflowDesktop:
    type: application
    platform: macOS
    sources:
      - path: VoiceflowDesktop
        excludes:
          - Resources/Info.plist
          - Resources/VoiceflowDesktop.entitlements
          - Resources/VoiceflowDesktop-adhoc.entitlements
          - Resources/VoiceflowDesktop-release.entitlements
          - Resources/AppIcon.icns
          - Resources/MenuBarIcon.png
          - Resources/MenuBarIcon@2x.png
          - Resources/MenuBarIcon@3x.png
    resources:
      - VoiceflowDesktop/Resources/Info.plist
      - path: VoiceflowDesktop/Resources/AppIcon.icns
        optional: true
      - path: VoiceflowDesktop/Resources/MenuBarIcon.png
        optional: true
      - path: VoiceflowDesktop/Resources/MenuBarIcon@2x.png
        optional: true
      - path: VoiceflowDesktop/Resources/MenuBarIcon@3x.png
        optional: true
    dependencies:
      - package: KeyboardShortcuts
      - sdk: CoreAudio.framework    # AudioDeviceID, AudioObjectGetPropertyData
      - sdk: AudioToolbox.framework # AudioUnitSetProperty, kAudioOutputUnitProperty_CurrentDevice
      - sdk: CoreGraphics.framework # CGEventPost for ⌘V simulation
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LSUIElement: YES  # Hides from Dock, shows in menu bar only
