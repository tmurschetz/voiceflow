name: VoiceflowDesktop
options:
  bundleIdPrefix: com.voiceflow
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.voiceflow.desktop
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Fill in your Apple Developer Team ID
    INFOPLIST_FILE: VoiceflowDesktop/Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: VoiceflowDesktop/Resources/VoiceflowDesktop.entitlements
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  VoiceflowDesktop:
    type: application
    platform: macOS
    sources:
      - path: VoiceflowDesktop
        excludes:
          - Resources/Info.plist
          - Resources/VoiceflowDesktop.entitlements
    resources:
      - VoiceflowDesktop/Resources/Info.plist
    dependencies:
      - package: KeyboardShortcuts
      - sdk: CoreAudio.framework    # AudioDeviceID, AudioObjectGetPropertyData
      - sdk: AudioToolbox.framework # AudioUnitSetProperty, kAudioOutputUnitProperty_CurrentDevice
      - sdk: CoreGraphics.framework # CGEventPost for ⌘V simulation
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LSUIElement: YES  # Hides from Dock, shows in menu bar only
